<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Smileyan logo - friendly robot">
  <title>Smileyan Logo · 可爱小机器人</title>
  <desc>蓝色圆头小机器人，橙色独角，微笑弧线，腮红贴片。配色 #409eff / #1e6bb8 / #FF8C42。</desc>

  <!-- 橙色独角（点缀色） -->
  <polygon points="256,8 232,114 280,114" fill="#FF8C42"/>
  <polygon points="256,8 244,66 256,66" fill="#FFB07A"/>

  <!-- 身体外圆（主蓝） -->
  <circle cx="256" cy="266" r="216" fill="#409eff"/>

  <!-- 身体阴影（深蓝） -->
  <path d="M 256 482
           a 216 216 0 0 0 216 -216
           a 216 216 0 0 1 -216 216 z"
        fill="#1e6bb8" opacity="0.18"/>

  <!-- 脸部下半（浅色肚子区） -->
  <ellipse cx="256" cy="322" rx="128" ry="102" fill="#e8f3ff"/>

  <!-- 腮红 -->
  <ellipse cx="148" cy="322" rx="26" ry="16" fill="#FF8C42" opacity="0.55"/>
  <ellipse cx="364" cy="322" rx="26" ry="16" fill="#FF8C42" opacity="0.55"/>

  <!-- 眼睛（白色眼白） -->
  <ellipse cx="194" cy="240" rx="28" ry="34" fill="#ffffff"/>
  <ellipse cx="318" cy="240" rx="28" ry="34" fill="#ffffff"/>

  <!-- 眼睛瞳孔 -->
  <circle cx="198" cy="246" r="14" fill="#1e6bb8"/>
  <circle cx="314" cy="246" r="14" fill="#1e6bb8"/>

  <!-- 眼睛高光 -->
  <circle cx="203" cy="240" r="5" fill="#ffffff"/>
  <circle cx="319" cy="240" r="5" fill="#ffffff"/>

  <!-- 微笑弧线 -->
  <path d="M 214 356 Q 256 388 298 356" fill="none" stroke="#1e6bb8" stroke-width="10" stroke-linecap="round"/>

  <!-- 笑容标记小角 -->
  <path d="M 190 178 L 216 152 L 190 178 Z" fill="#FF8C42" opacity="0.85"/>
  <circle cx="190" cy="178" r="5" fill="#FF8C42"/>
</svg>