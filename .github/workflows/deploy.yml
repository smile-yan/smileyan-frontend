name: build-and-deploy

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate-config:
    name: Validate deployment config
    runs-on: ubuntu-latest

    steps:
      - name: Check SERVERS_CONFIG
        # Validate before the build/matrix so a malformed SERVERS_CONFIG fails
        # with a readable message instead of an opaque fromJSON error.
        env:
          RAW: ${{ vars.SERVERS_CONFIG }}
        run: |
          python3 - <<'PY'
          import json, os, sys

          raw = os.environ.get("RAW", "").strip()
          if not raw:
              sys.exit("ERROR: repository variable SERVERS_CONFIG is empty")

          try:
              servers = json.loads(raw)
          except json.JSONDecodeError as exc:
              sys.exit(f"ERROR: SERVERS_CONFIG is not valid JSON: {exc}")

          if not isinstance(servers, list) or not servers:
              sys.exit("ERROR: SERVERS_CONFIG must be a non-empty JSON array")

          required = ("name", "addr", "port", "user", "deploy_path")
          failed = False
          for index, server in enumerate(servers):
              if not isinstance(server, dict):
                  print(f"ERROR: SERVERS_CONFIG[{index}] is not an object", file=sys.stderr)
                  failed = True
                  continue
              missing = [key for key in required if not str(server.get(key, "")).strip()]
              if missing:
                  print(
                      f"ERROR: SERVERS_CONFIG[{index}] "
                      f"({server.get('name', '<unnamed>')}) is missing: {', '.join(missing)}",
                      file=sys.stderr,
                  )
                  failed = True

          if failed:
              sys.exit(1)

          print(f"OK: {len(servers)} server(s) configured")
          PY

  build:
    name: Build and package
    needs: validate-config
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --registry=https://registry.npmmirror.com

      - name: Build for production
        # VITE_API_BASE_URL 留空时，dist 中的请求走相对路径 /api，
        # 由服务器侧 Nginx/Caddy 反向代理转发（推荐）。
        # 如需让 dist 直连某个绝对地址，在仓库 Settings -> Secrets and variables ->
        # Actions -> Variables 中配置 PROD_API_BASE_URL（敏感地址用 Secrets 注入）。
        env:
          VITE_API_BASE_URL: ${{ vars.PROD_API_BASE_URL || secrets.PROD_API_BASE_URL || '' }}
        run: npm run build:prod

      - name: Pack dist into tarball
        run: |
          tar -czf smileyan-frontend-${{ github.ref_name }}.tar.gz -C dist .

      - name: Upload tarball artifact
        # Downloadable from the run page for debugging; consumed by the deploy
        # job so the build runs once regardless of how many servers are listed.
        uses: actions/upload-artifact@v7
        with:
          name: smileyan-frontend-${{ github.ref_name }}
          path: smileyan-frontend-${{ github.ref_name }}.tar.gz
          retention-days: 7

  deploy:
    name: Deploy to ${{ matrix.server.name }}
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        # SERVERS_CONFIG is a JSON array stored as a Repository Variable:
        # [
        #   {
        #     "name": "prod-1",
        #     "addr": "1.2.3.4",
        #     "port": "22",
        #     "user": "deploy",
        #     "deploy_path": "/opt/bigbigpig-frontend"
        #   }
        # ]
        # `deploy_path` is where the dist tarball is extracted on that server;
        # point Caddy/Nginx at the same directory.
        server: ${{ fromJSON(vars.SERVERS_CONFIG || '[]') }}

    steps:
      - name: Download tarball artifact
        uses: actions/download-artifact@v8
        with:
          name: smileyan-frontend-${{ github.ref_name }}
          path: .

      - name: Copy tarball to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ matrix.server.addr }}
          port: ${{ matrix.server.port }}
          username: ${{ matrix.server.user }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "smileyan-frontend-${{ github.ref_name }}.tar.gz"
          target: "/tmp/"
          strip_components: 0

      - name: Run deploy script on server
        uses: appleboy/ssh-action@v1.2.5
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          DEPLOY_DIR: ${{ matrix.server.deploy_path }}
        with:
          host: ${{ matrix.server.addr }}
          port: ${{ matrix.server.port }}
          username: ${{ matrix.server.user }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          envs: RELEASE_TAG,DEPLOY_DIR
          script: |
            set -eo pipefail
            export RELEASE_TAG="$RELEASE_TAG"
            : "${DEPLOY_DIR:?DEPLOY_DIR is required (deploy_path in SERVERS_CONFIG)}"
            # 支持两种文件名：旧版固定名 / 新版带 tag 名
            PKG=""
            for candidate in "/tmp/smileyan-frontend-${RELEASE_TAG}.tar.gz" "/tmp/smileyan-frontend.tar.gz"; do
              if [ -f "$candidate" ]; then PKG="$candidate"; break; fi
            done
            if [ -z "$PKG" ]; then
              echo "missing tarball under /tmp/; ls -la /tmp/:"
              ls -la /tmp/
              exit 1
            fi
            echo "using package: $PKG"
            TAG="${RELEASE_TAG:-unknown}"
            TS=$(date +%Y%m%d-%H%M%S)
            # 备份目录放在部署目录的上一级，兼容 /var/www/html 与 /opt/xxx
            BACKUP_DIR="$(dirname "$DEPLOY_DIR")/.backups/smileyan-frontend"

            sudo mkdir -p "$BACKUP_DIR"
            if [ -d "$DEPLOY_DIR" ] && [ -n "$(sudo ls -A "$DEPLOY_DIR" 2>/dev/null || true)" ]; then
              sudo tar -czf "$BACKUP_DIR/${TS}-${TAG}.tar.gz" -C "$DEPLOY_DIR" .
              # keep only the most recent 3 backups
              sudo ls -1tr "$BACKUP_DIR" | head -n -3 | xargs -r sudo rm -rf --
            fi

            sudo mkdir -p "$DEPLOY_DIR"
            sudo find "$DEPLOY_DIR" -mindepth 1 -delete
            sudo tar -xzf "$PKG" -C "$DEPLOY_DIR"
            sudo rm -f "$PKG"

            if command -v curl >/dev/null 2>&1; then
              sleep 1
              curl -fsS -o /dev/null "http://127.0.0.1/" || echo "WARN: local health check failed"
            fi

            echo "deploy ok: tag=$TAG at $TS -> $DEPLOY_DIR"
